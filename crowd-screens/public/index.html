<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Miradore Live</title>
<style>
  html,body{margin:0;height:100%;background:#0B1215;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #stage{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
  #txt{font-weight:900;line-height:1.02;text-align:center;padding:4vw;max-width:100vw;box-sizing:border-box}
  #dot{position:fixed;right:10px;bottom:10px;width:8px;height:8px;border-radius:50%;background:#FF6B35;opacity:.7;display:none}
  .full{position:fixed;inset:0;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:8vw;box-sizing:border-box}
  #join{background:radial-gradient(120% 80% at 50% 0%,#3a1a0e 0%,#0B1215 60%);z-index:3}
  #idle{background:#0B1215;z-index:2;display:none}
  .brand{font-size:9vw;letter-spacing:.3em;margin:0 0 0 .3em;color:#FF6B35;font-weight:800}
  .show{font-size:5vw;letter-spacing:.2em;color:#C9A84C;margin:2vw 0 0;font-weight:700;text-transform:uppercase}
  .full p{margin:1.5vw 0;color:#c9d1d3;font-size:4.4vw;line-height:1.4}
  #go{margin:8vw 0 6vw;padding:5vw 11vw;font-size:6vw;font-weight:800;border:0;border-radius:99px;
    background:#FF6B35;color:#0B1215;box-shadow:0 0 0 0 rgba(255,107,53,.6);animation:ring 1.8s infinite}
  .full small{color:#7d8a8d;font-size:3.3vw;line-height:1.5;margin-top:3vw}
  #orb{width:34vw;height:34vw;max-width:220px;max-height:220px;border-radius:50%;margin-bottom:8vw;
    background:radial-gradient(circle,#FF6B35 0%,#C9A84C 45%,rgba(0,188,176,0) 72%);animation:breathe 3.2s ease-in-out infinite}
  #idle h2{font-size:7vw;margin:0 0 2vw;font-weight:800}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,107,53,.55)}100%{box-shadow:0 0 0 7vw rgba(255,107,53,0)}}
  @keyframes breathe{0%,100%{transform:scale(.8);opacity:.55}50%{transform:scale(1.05);opacity:1}}
  @media(min-width:700px){.brand{font-size:56px}.show{font-size:26px}.full p{font-size:22px}
    #go{font-size:28px;padding:22px 56px;margin:40px 0 28px}.full small{font-size:15px}#idle h2{font-size:40px}}
</style>
</head>
<body>
<div id="stage"><div id="txt"></div></div>
<div id="idle" class="full">
  <div id="orb"></div>
  <h2>You're in.</h2>
  <p>Keep this page open and your brightness up.<br>Your screen lights up when the show starts.</p>
</div>
<div id="dot"></div>
<div id="join" class="full">
  <div class="brand">MIRADORE</div>
  <div class="show">__SHOW__</div>
  <button id="go">Tap to join</button>
  <p>Turn your brightness all the way up<br>and hold your screen up high.</p>
  <small>Keep this page open. Your screen will show flashing colours.</small>
</div>
<script>/*__LOOKS__*/</script>
<script>
(function(){
'use strict';
var stage=document.getElementById('stage'),txt=document.getElementById('txt'),dot=document.getElementById('dot'),
    idle=document.getElementById('idle');
var zone=new URLSearchParams(location.search).get('z')||'';
var seed=(Math.random()*4294967296)>>>0;      // makes sparkle and split different on every phone
var eng=Looks.create({seed:seed,idx:0,n:1});
var offset=0,synced=false;                    // show time = performance.now() + offset
var ws=null,retry=0,timer=null,started=false;

function now(){return performance.now()+offset}

// ----- connection: reconnects by itself, with a random delay so 4,000 phones do not retry at once
function connect(){
  clearTimeout(timer);timer=null;
  var s=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws=s;
  s.onopen=function(){
    if(s!==ws)return;
    retry=0;dot.style.display='none';
    s.send(JSON.stringify({t:'hello',role:'aud',zone:zone}));burst(6);
  };
  s.onmessage=function(e){
    if(s!==ws)return;
    var m;try{m=JSON.parse(e.data)}catch(_){return}
    if(m.t==='sync')onSync(m);
    else if(m.t==='welcome'){
      eng.ctx.idx=m.idx;eng.ctx.n=m.n;eng.setMaster(m.master,true);
      if(m.cue)eng.push(m.cue);else eng.reset();   // no live look means the show is on standby
    }
    else if(m.t==='cue')eng.push(m);
    else if(m.t==='master')eng.setMaster(m.v);
  };
  s.onclose=s.onerror=function(){if(s===ws)dropped()};
}
function dropped(){
  // The current look keeps running while we reconnect.
  var s=ws;ws=null;
  if(s){s.onopen=s.onmessage=s.onclose=s.onerror=null;try{s.close()}catch(_){}}
  dot.style.display='block';
  if(timer)return;
  retry=Math.min(retry+1,6);
  timer=setTimeout(connect,400+Math.random()*1200*retry);
}

// ----- clock sync: several pings, keep the one with the shortest round trip
var best=null,burstId=0;
function burst(n){
  var id=++burstId,s=ws;best=null;
  for(var i=0;i<n;i++)setTimeout(function(){
    if(s===ws&&s.readyState===1)s.send(JSON.stringify({t:'sync',c:performance.now()}));
  },i*180);
  setTimeout(function(){
    if(id!==burstId||s!==ws)return;
    if(!best)return dropped();       // no answer at all: the connection is dead, start again
    if(!synced||Math.abs(best.off-offset)>60)offset=best.off;   // first fix, or a real jump
    else offset=offset*0.7+best.off*0.3;                         // otherwise smooth out jitter
    synced=true;
  },n*180+4000);
}
function onSync(m){
  var t=performance.now(),rtt=t-m.c;
  if(rtt<0||rtt>10000)return;
  if(!best||rtt<best.rtt){
    best={rtt:rtt,off:m.s-(m.c+rtt/2)};
    if(!synced)offset=best.off;      // use the first answer straight away, refine after
  }
}
setInterval(function(){if(started&&ws&&ws.readyState===1)burst(3)},30000);

// ----- drawing
function css(c){return'rgb('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+')'}
var shownBg='',shownTxt='',shownIdle=null,shownFg='';
function frame(){
  requestAnimationFrame(frame);
  var f=eng.frame(now());
  if(f.idle!==shownIdle){shownIdle=f.idle;idle.style.display=f.idle?'flex':'none'}
  var bg=css(f.c);
  if(bg!==shownBg){shownBg=bg;stage.style.background=bg}
  if(f.text!==shownTxt){
    shownTxt=f.text;txt.textContent=f.text;
    if(f.text){var w=f.text.split(/\s+/).reduce(function(a,b){return Math.max(a,b.length)},1);
      txt.style.fontSize=Math.min(34,100/w)+'vw'}
  }
  if(f.text){var fg=css(f.fg);if(fg!==shownFg){shownFg=fg;txt.style.color=fg}}
}

// ----- keep the screen awake
function wake(){
  if(!('wakeLock' in navigator))return;
  navigator.wakeLock.request('screen').catch(function(){});
}
function resumed(){
  if(!started)return;
  wake();
  synced=false;                       // the phone's timer may have paused while the page was hidden
  if(ws&&ws.readyState===1)burst(4);
  else if(!ws||ws.readyState>1){clearTimeout(timer);timer=null;retry=0;connect()}
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')resumed()});
window.addEventListener('pageshow',function(e){if(e.persisted)resumed()});
window.addEventListener('online',resumed);

document.getElementById('go').addEventListener('click',function(){
  if(started)return;started=true;
  document.getElementById('join').style.display='none';
  wake();
  var el=document.documentElement;
  try{if(el.requestFullscreen){var p=el.requestFullscreen({navigationUI:'hide'});if(p&&p.catch)p.catch(function(){})}}catch(_){}
  connect();
  requestAnimationFrame(frame);
});
if(!document.querySelector('.show').textContent)document.querySelector('.show').style.display='none';
})();
</script>
</body>
</html>
