<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B1215">
<title>Miradore Live</title>
<style>
  html,body{margin:0;height:100%;background:#0B1215;overflow:hidden;touch-action:manipulation;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #stage{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
  #txt{font-weight:900;line-height:1;text-align:center;padding:4vw;max-width:100vw;box-sizing:border-box}
  #dot{position:fixed;right:10px;bottom:10px;width:8px;height:8px;border-radius:50%;background:#FF6B35;opacity:.7;display:none}
  #join{position:fixed;inset:0;background:#0B1215;color:#fff;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:8vw;box-sizing:border-box;z-index:2}
  #join h1{font-size:9vw;letter-spacing:.3em;margin:0 0 2vw;color:#FF6B35;font-weight:800}
  #join p{margin:1.5vw 0;color:#c9d1d3;font-size:4.4vw;line-height:1.4}
  #go{margin:7vw 0 5vw;padding:5vw 10vw;font-size:6vw;font-weight:800;border:0;border-radius:99px;
    background:#FF6B35;color:#0B1215}
  #join small{color:#7d8a8d;font-size:3.3vw;line-height:1.5}
  @media(min-width:700px){#join h1{font-size:56px}#join p{font-size:22px}#go{font-size:28px;padding:22px 56px;margin:36px 0 24px}#join small{font-size:15px}}
</style>
</head>
<body>
<div id="stage"><div id="txt"></div></div>
<div id="dot"></div>
<div id="join">
  <h1>MIRADORE</h1>
  <p>Your phone is about to become part of the show.</p>
  <button id="go">Tap to join</button>
  <p>Turn your brightness all the way up<br>and hold your screen towards the stage.</p>
  <small>Keep this page open. Your screen will show flashing colours.</small>
</div>
<script>
(function(){
'use strict';
var stage=document.getElementById('stage'),txt=document.getElementById('txt'),dot=document.getElementById('dot');
var zone=new URLSearchParams(location.search).get('z')||'';
var seed=(Math.random()*4294967296)>>>0;      // makes sparkle different on every phone
var offset=0,synced=false;                    // server time = performance.now() + offset
var zoneIdx=0,zoneN=1;
var cur=null,queue=[],fromColor=[0,0,0],lastColor=[0,0,0];
var ws=null,retry=0,started=false;

function now(){return performance.now()+offset}

// ----- connection: reconnects by itself, with random delay so 4,000 phones do not retry at once
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onopen=function(){retry=0;dot.style.display='none';ws.send(JSON.stringify({t:'hello',role:'aud',zone:zone}));burst(6)};
  ws.onmessage=function(e){
    var m;try{m=JSON.parse(e.data)}catch(_){return}
    if(m.t==='sync')onSync(m);
    else if(m.t==='welcome'){zoneIdx=m.idx;zoneN=m.n;if(m.cue)queue.push(m.cue)}
    else if(m.t==='cue')queue.push(m);
  };
  ws.onclose=function(){
    dot.style.display='block';           // the current look keeps running while we reconnect
    retry=Math.min(retry+1,5);
    setTimeout(connect,500+Math.random()*1500*retry);
  };
  ws.onerror=function(){try{ws.close()}catch(_){}};
}

// ----- clock sync: several pings, keep the one with the shortest round trip
var best=null,pending=0;
function burst(n){
  best=null;pending=n;
  for(var i=0;i<n;i++)setTimeout(function(){
    if(ws&&ws.readyState===1)ws.send(JSON.stringify({t:'sync',c:performance.now()}));
  },i*180);
  setTimeout(applySync,n*180+1500);
}
function onSync(m){
  var t=performance.now(),rtt=t-m.c;
  if(!best||rtt<best.rtt){
    best={rtt:rtt,off:m.s-(m.c+rtt/2)};
    if(!synced)offset=best.off;          // use the first answer straight away, refine after
  }
}
function applySync(){
  if(!best)return;
  if(!synced||Math.abs(best.off-offset)>60)offset=best.off;   // first fix, or a real jump
  else offset=offset*0.7+best.off*0.3;                         // otherwise smooth out jitter
  synced=true;
}
setInterval(function(){if(ws&&ws.readyState===1)burst(3)},30000);

// ----- looks
function hash(a,b){var x=Math.imul(a^0x9e3779b9,0x85ebca6b)^Math.imul(b+0x7f4a7c15,0xc2b2ae35);
  x^=x>>>15;x=Math.imul(x,0x2c1b3c6d);x^=x>>>12;return(x>>>0)/4294967296}
function hue(h){h=((h%1)+1)%1*6;var x=1-Math.abs(h%2-1),r=0,g=0,b=0;
  if(h<1){r=1;g=x}else if(h<2){r=x;g=1}else if(h<3){g=1;b=x}else if(h<4){g=x;b=1}else if(h<5){r=x;b=1}else{r=1;b=x}
  return[r*255,g*255,b*255]}
function mix(a,b,k){return[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k]}
function dim(c,k){return[c[0]*k,c[1]*k,c[2]*k]}
function colorAt(l,at,t){
  var p;
  switch(l.type){
    case 'color':return l.fade>0?mix(fromColor,l.c,Math.min(1,Math.max(0,(t-at)/l.fade))):l.c;
    case 'rainbow':return hue(t/l.period-zoneIdx/zoneN);
    case 'pulse':p=(((t-l.t0)/(60000/l.bpm))%1+1)%1;return dim(l.c,0.08+0.92*(1-p)*(1-p));
    case 'sparkle':var slot=Math.floor(t/450),f=(t/450)%1;
      return hash(seed,slot)<0.35?dim(l.c,Math.sin(Math.PI*f)):[0,0,0];
    case 'chase':p=Math.max(0,Math.cos(2*Math.PI*(t/l.period-zoneIdx/zoneN)));return dim(l.c,p*p*p);
    case 'cycle':p=(((t/l.period-zoneIdx/zoneN)%1)+1)%1*l.colors.length;var i=Math.floor(p);
      return mix(l.colors[i%l.colors.length],l.colors[(i+1)%l.colors.length],p-i);
    case 'text':case 'countdown':return l.bg;
  }
  return[0,0,0];
}
function css(c){return'rgb('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+')'}

var shownBg='',shownTxt='';
function setText(s,fg){
  if(s===shownTxt)return;shownTxt=s;
  txt.textContent=s;
  if(s){var w=s.split(/\s+/).reduce(function(a,b){return Math.max(a,b.length)},1);
    txt.style.fontSize=Math.min(34,100/w)+'vw';txt.style.color=css(fg)}
}
function frame(){
  requestAnimationFrame(frame);
  var t=now();
  for(var i=0;i<queue.length;i++)if(queue[i].at<=t){
    var q=queue.splice(i,1)[0];i--;
    if(!cur||q.at>=cur.at){fromColor=lastColor;cur=q}
  }
  if(!cur)return;
  var l=cur.look,c=colorAt(l,cur.at,t),bg=css(c);
  lastColor=c;
  if(bg!==shownBg){shownBg=bg;stage.style.background=bg}
  if(l.type==='text')setText(l.text,l.fg);
  else if(l.type==='countdown'){var left=Math.ceil((l.end-t)/1000);setText(left>0?String(left):l.endText,l.fg)}
  else setText('');
}

// ----- keep the screen awake
var lock=null;
function wake(){
  if(!('wakeLock' in navigator))return;
  navigator.wakeLock.request('screen').then(function(l){lock=l}).catch(function(){});
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&started){wake();if(ws&&ws.readyState===1)burst(3)}
});

document.getElementById('go').addEventListener('click',function(){
  if(started)return;started=true;
  document.getElementById('join').style.display='none';
  wake();
  var el=document.documentElement;
  if(el.requestFullscreen)el.requestFullscreen({navigationUI:'hide'}).catch(function(){});
  connect();
  requestAnimationFrame(frame);
});
})();
</script>
</body>
</html>
